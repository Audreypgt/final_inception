services:
  nginx:
    container_name: nginx
    image: nginx
    build:
      requirements/nginx
    restart: unless-stopped
    env_file: .env
    ports:
      - 443:443
    depends_on:
      - wordpress
    networks:
      - docker-network
    volumes:
      - wordpress_vol:/var/www/wordpress
  mariadb:
    container_name: mariadb
    image: mariadb
    build:
      requirements/mariadb
    restart: unless-stopped
    env_file: .env
    networks:
      - docker-network
    volumes:
      - mariadb_vol:/var/lib/mysql
    secrets:
      - db_root_password
      - db_user_password
    environment:
      - DB_DATABASE
      - DB_USER

  wordpress:
    container_name: wordpress
    image: wordpress
    build:
      requirements/wordpress
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mariadb
    networks:
      - docker-network
    volumes:
      - wordpress_vol:/var/www/wordpress
    secrets: 
      - wp_root_password
      - wp_user_password
      - db_user_password
    environment:
      - WP_USER
      - WP_TITLE
      - WP_ADMIN_USER

networks:
  docker-network:
    driver: bridge 

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/mariadb
  wordpress_vol:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/apeuget42/data/wordpress

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  wp_root_password:
    file: ../secrets/wp_root_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
